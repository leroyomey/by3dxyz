name: Catalog check

# Advisory only. This runs beside the Pages deploy, never in front of it, so a
# catalog warning can never take the live site down.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # The Etsy sync bot pushes with GITHUB_TOKEN, which does not start other
  # workflows, so the catalog it commits is checked here instead.
  workflow_run:
    workflows: ["Etsy catalog sync"]
    types: [completed]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run catalog:check
