name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Etsy sync pushes with GITHUB_TOKEN, which does not start other workflows.
  workflow_run:
    workflows: ["Etsy catalog sync"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run.head_sha is the Etsy job's starting commit, before it
          # pushes the catalog. github.sha is current main, which has the new tools.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build
        env:
          PUBLIC_PAYPAL_CLIENT_ID: ${{ secrets.PUBLIC_PAYPAL_CLIENT_ID }}
          PUBLIC_ORDER_NOTIFY_EMAIL: ${{ secrets.PUBLIC_ORDER_NOTIFY_EMAIL }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
